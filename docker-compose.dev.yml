version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  ai-service:
    environment:
      - LOG_LEVEL=debug
    volumes:
      - ./ai_service:/app/ai_service
    command: uvicorn ai_service.main:app --host 0.0.0.0 --port 8000 --reload
