version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: agilepulse_nginx
    ports:
      - "3000:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - ai-service
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agilepulse_backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://agile_user:agile_secret_pass@postgres:5432/agilepulse_db
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    container_name: agilepulse_ai_service
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: agilepulse_postgres
    environment:
      POSTGRES_USER: agile_user
      POSTGRES_PASSWORD: agile_secret_pass
      POSTGRES_DB: agilepulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agile_user -d agilepulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: agilepulse_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
  redis_data:
